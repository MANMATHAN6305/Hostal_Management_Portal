# College Hostel Management Portal - Application Configuration
spring.application.name=hostel-management-portal

# Server Configuration
server.port=8080

# Database Configuration (H2 In-Memory)
spring.datasource.url=jdbc:h2:mem:hostel_portal;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# H2 Console (access at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.defer-datasource-initialization=true

# Logging Configuration
logging.level.com.hotelmanagement=DEBUG
logging.level.org.springframework.web=INFO

# CORS Configuration
# Frontend runs on port 3000
frontend.url=http://localhost:3000

# Application Banner
spring.main.banner-mode=console
